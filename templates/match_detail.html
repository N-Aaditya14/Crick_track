<div style="margin-top:1rem;">
    <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete this match and all its data?')) deleteMatch()">Delete Match</button>
</div>

<!-- ══ WIN PROBABILITY GRAPH ══ -->
<div class="card" style="margin-top:1.5rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <div>
            <div class="section-label">Win Probability</div>
            <div style="font-size:0.75rem; color:var(--text-dim); margin-top:0.15rem;">How the match ebbed and flowed</div>
        </div>
        <div style="display:flex; gap:1rem; font-size:0.72rem;">
            <span style="display:flex; align-items:center; gap:0.35rem;">
                <span style="width:10px; height:2px; background:var(--accent); display:inline-block; border-radius:1px;"></span>
                {{ match.team_a_name }}
            </span>
            <span style="display:flex; align-items:center; gap:0.35rem; color:var(--text-dim);">
                <span style="width:10px; height:2px; background:#448aff; display:inline-block; border-radius:1px;"></span>
                {{ match.team_b_name }}
            </span>
        </div>
    </div>
    <canvas id="win-prob-chart" height="180"></canvas>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const MATCH_ID = {{ match.id }};
const IS_LIVE = {{ 'true' if match.status != 'complete' else 'false' }};

async function deleteMatch() {
    await fetch('/api/match/{{ match.id }}/delete', {method: 'POST'});
    window.location.href = '/';
}

let winProbChart = null;

async function refreshWinProbability() {
    const res = await fetch(`/api/match/${MATCH_ID}/win_probability`);
    const d = await res.json();
    if (!d.data_points || d.data_points.length < 2) return;

    const labels = d.data_points.map(p => p.label);
    const probs  = d.data_points.map(p => p.probability);
    const anti   = probs.map(p => 100 - p);
    const inn1Color = 'rgba(0,230,118,0.85)';
    const inn2Color = 'rgba(68,138,255,0.85)';
    const pointColors = d.data_points.map(p => p.innings === 1 ? inn1Color : inn2Color);

    if (winProbChart) {
        winProbChart.data.labels = labels;
        winProbChart.data.datasets[0].data = probs;
        winProbChart.data.datasets[0].pointBackgroundColor = pointColors;
        winProbChart.data.datasets[1].data = anti;
        winProbChart.update('none');
        return;
    }

    const ctx = document.getElementById('win-prob-chart').getContext('2d');
    winProbChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: d.team_a,
                    data: probs,
                    borderColor: inn1Color,
                    pointBackgroundColor: pointColors,
                    pointBorderColor: pointColors,
                    backgroundColor: 'rgba(0,230,118,0.06)',
                    fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2
                },
                {
                    label: d.team_b,
                    data: anti,
                    borderColor: inn2Color,
                    pointBackgroundColor: pointColors.map(() => inn2Color),
                    pointBorderColor: pointColors.map(() => inn2Color),
                    backgroundColor: 'rgba(68,138,255,0.06)',
                    fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2
                }
            ]
        },
        options: {
            responsive: true,
            animation: { duration: 400 },
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#555', font: { size: 10 }, maxRotation: 45 } },
                y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#555', font: { size: 10 }, callback: v => v + '%' } }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1f1f1f', borderColor: '#2a2a2a', borderWidth: 1,
                    titleColor: '#f0f0f0', bodyColor: '#999',
                    callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}%` }
                }
            }
        }
    });
}

refreshWinProbability();
if (IS_LIVE) {
    setInterval(() => { location.reload(); }, 30000);
}
</script>
{% endblock %}
